name: Validate learning library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository and generated navigation
        run: python scripts/validate.py
      - name: Test validator with valid and invalid fixtures
        run: python -m unittest discover -s tests -v
      - name: Compile repository Python
        run: python -m compileall -q scripts tests ai/engineering-evidence/examples
      # Execution is deliberately restricted to trusted pushes on isolated hosted runners.
      - name: Check allowlisted local learning snippets
        if: github.event_name == 'push'
        run: python scripts/check_labs.py
